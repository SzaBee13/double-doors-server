# Shared SQL config. Must match bukkit/sql section when using SQL mode.
sql.enabled=false

# Enable anonymous FastStats tracking
# ALSO CHANGE IN plugins/faststats/config.properties
# Info we track is public usage data and can be viewed at: https://faststats.dev/project/double-doors-server
enableAnonymousTracking=true

# Examples:
# absolute sqlite: jdbc:sqlite:/absolute/path/to/doubledoors.db (absolute path required for proxy<->bukkit sharing)
# relative sqlite: jdbc:sqlite:plugins/DoubleDoors/doubledoors.db (relative path can cause issues with shared heartbeat detection)
# mysql: jdbc:mysql://127.0.0.1:3306/doubledoors
# Please refer to the documentation https://doubledoors.szabee.me/redirect?page=velocity-setup for more information.
sql.jdbcUrl=jdbc:sqlite:plugins/DoubleDoors/doubledoors.db
sql.username=
sql.password=

# Unique ID for this proxy instance in dd_proxy_presence.
sql.proxyId=velocity-main

# Heartbeat interval written by this proxy. Heartbeats include proxy-side Geyser/Floodgate detection state.
sql.heartbeatSeconds=30
